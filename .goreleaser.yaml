# Validated by the "goreleaser check" job in CI.
version: 2

project_name: authstunt

builds:
  - id: authstunt
    main: ./cmd/authstunt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# One multi-platform image, amd64 and arm64 both, deliberately: a
# single-arch image is invisible to half the audience (see MailHog #454,
# open for years over exactly this). The Dockerfile is COPY-only, so
# neither platform needs emulation. A snapshot builds per-platform images
# locally and never pushes; the real push happens from release.yml.
dockers_v2:
  - ids: [authstunt]
    dockerfile: Dockerfile
    images:
      - ghcr.io/ivermin1123/authstunt
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: authstunt
      org.opencontainers.image.licenses: MIT
    annotations:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: https://github.com/ivermin1123/authstunt

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: true

changelog:
  use: github
  sort: asc
