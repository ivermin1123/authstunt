# Action versions verified against latest releases on 2026-08-10.
name: ci

# WARNING before turning on branch protection: paths-ignore at the workflow
# level means the workflow does not run at all, not that it runs and passes.
# A required status check that never arrives blocks a merge forever. If any
# of these jobs is ever made a required check, replace paths-ignore with a
# path filter inside the jobs, or add a no-op job that reports the same check
# name. Checked on 2026-08-14: main is not protected, so this is safe today.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

# Consecutive pushes to the same ref cancel the older run instead of stacking,
# except on main.
#
# Main is exempt for a reason that outranks the saved minutes: the Windows job
# fails about one run in fifteen, and it is the only place that failure has
# ever been seen. Every push to main is therefore a trial of it, and the tests
# carry a dump that fires on that path. A cancelled run is a trial thrown away,
# and it has already happened once - two pushes a minute apart on 2026-08-15
# discarded the first one's Windows job. Per-commit history on main is worth
# having for its own sake too, for bisecting a CI failure and for the audit
# trail once the repo is public.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      # Same shape as the windows job: a skip leaves no trace in a plain
      # run, so the stream is parsed back into the readable log and then
      # asked what stepped aside. Nothing skips on Linux today, which is
      # exactly why it is worth stating rather than assuming.
      - name: Test
        shell: bash
        run: |
          set +e
          go test -count=1 -race -json ./... > test-output.json 2> test-stderr.txt
          status=$?
          set -e

          jq -r 'select(.Action=="output") | .Output' test-output.json || true
          cat test-stderr.txt

          echo "===== SKIPPED ====="
          jq -r 'select(.Action=="skip" and .Test != null) | "SKIP  \(.Package)  \(.Test)"' \
            test-output.json | sort -u
          jq -r 'select(.Action=="skip" and .Test == null) | "SKIP-PKG  \(.Package)"' \
            test-output.json | sort -u

          exit $status
      - name: Upload the test stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-ubuntu
          path: |
            test-output.json
            test-stderr.txt
          if-no-files-found: warn
      # Benchmarks are reported, never gating: they exist so the storage
      # choices stay falsifiable, not to fail a build on a noisy runner.
      - name: benchmarks (reported, not gating)
        continue-on-error: true
        run: go test -run '^$' -bench . -benchtime 10x ./...

  # The POSIX key-file permission test skips on Windows, where mode bits
  # grant nobody anything. Only a Windows runner executes the DACL
  # assertion that replaces it, so without this job the key file's
  # protection on Windows is untested.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      # Plain `go test` prints nothing about a skip, so this job reported ok
      # whether a test ran or stepped aside. That is not a hypothetical: the
      # SIGTERM tests skip here, and the log said the same thing either way.
      # The JSON stream is parsed back into the human log, then asked which
      # tests skipped.
      - name: Test
        shell: bash
        run: |
          set +e
          go test -count=1 -race -json ./... > test-output.json 2> test-stderr.txt
          status=$?
          set -e

          # dựng lại log người đọc được, y như bản không -json
          jq -r 'select(.Action=="output") | .Output' test-output.json || true
          cat test-stderr.txt

          echo "===== SKIPPED ====="
          jq -r 'select(.Action=="skip" and .Test != null) | "SKIP  \(.Package)  \(.Test)"' \
            test-output.json | sort -u
          jq -r 'select(.Action=="skip" and .Test == null) | "SKIP-PKG  \(.Package)"' \
            test-output.json | sort -u

          exit $status
      # Uploaded even when the tests fail: the flake hunt needs the machine
      # readable stream from the run that failed, not from a green rerun.
      - name: Upload the test stream
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-windows
          path: |
            test-output.json
            test-stderr.txt
          if-no-files-found: warn

  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - run: go build ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  # Ubuntu only, on purpose: the package is plain TypeScript over global
  # fetch with zero runtime dependencies, so there is no platform-specific
  # code path a Windows or macOS runner would exercise. What IS platform
  # sensitive lives in the Go binary, and the jobs above already run that
  # on a Windows runner. The Go toolchain is here because the client tests
  # build and drive the real server binary; nothing in this job touches the
  # Go jobs' caches or gates.
  client:
    runs-on: ubuntu-latest
    # First job in this workflow that could hang unbounded: node:test has
    # no default per-test timeout, unlike go test's 10 minute panic timer.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # The tests import src, so nothing else executes the built artifact;
      # this does, under both module systems.
      - run: npm run smoke
      # publint and arethetypeswrong gate the packaging itself: dual
      # ESM+CJS with a declaration file per format has to stay true under
      # every resolver, not just the one the tests happen to use.
      - run: npm run check:package
      - run: npm test
