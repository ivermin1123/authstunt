# Action versions verified against latest releases on 2026-08-13.
name: release

on:
  push:
    tags: ["v*"]

# ci.yml stays read-only. Only this workflow needs write: contents to
# create the draft release and upload its archives, packages to push the
# Docker images to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from tag history. A shallow
          # clone yields a wrong changelog silently, it does not fail, so
          # the full history is required rather than merely nice to have.
          fetch-depth: 0
      # From go.mod, for the reason spelled out in ci.yml: a named "1.26.x"
      # resolves to whatever the runner has cached, and a release is the last
      # place to ship a binary built with an older standard library than the
      # module asked for.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Dockerfile is COPY-only (goreleaser cross-compiles the binary
      # first), so the arm64 image builds here without QEMU.
      #
      # buildx needs the docker-container driver, not the default docker
      # driver: goreleaser asks for an SBOM attestation and a two-platform
      # manifest in one push, and the default driver supports neither. A
      # snapshot build cannot catch this, because it never pushes and never
      # attests.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
