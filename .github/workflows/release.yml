# Action versions verified against latest releases on 2026-08-13.
name: release

on:
  push:
    tags: ["v*"]

# ci.yml stays read-only. Only this workflow needs write, and only to
# create the draft release and upload its archives.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds the changelog from tag history. A shallow
          # clone yields a wrong changelog silently, it does not fail, so
          # the full history is required rather than merely nice to have.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
